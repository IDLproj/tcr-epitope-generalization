
#CNN architecture
model:
  embedding_dim: 16
  num_filters: 64
  kernel_size: 3
  hidden_dim: 64
  dropout: 0.3

#Training hyperparameters
training:
  batch_size: 64
  epochs: 30
  learning_rate: 0.001
  patience: 31
  weight_decay: 0.0001
  seed: 8

#Data configuration
data:
  maxlen_b3: 23
  maxlen_pep: 12
  train_path: splits/train.csv
  val_path: splits/val.csv
  test_path: splits/test.csv

#Output locations
output:
  checkpoint: results/checkpoints/cnn_best.pt
  predictions: results/predictions/preds_cnn_full.csv
  learning_curve: results/figures/cnn_learning_curve.png
