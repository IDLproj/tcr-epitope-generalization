model:
  embedding_dim: 16
  num_filters: 64
  kernel_size: 3
  hidden_dim: 64
  dropout: 0.3
  ablate: peptide

training:
  batch_size: 64
  epochs: 30
  learning_rate: 0.001
  patience: 31
  weight_decay: 0.0001
  seed: 8

data:
  maxlen_b3: 23
  maxlen_pep: 16
  train_path: splits/tchard/RN/hard/seed0/train.csv
  val_path:   splits/tchard/RN/hard/seed0/val.csv
  test_path:  splits/tchard/RN/hard/seed0/test.csv

output:
  checkpoint:     results/checkpoints/cnn_receptor_only_RN_hard_seed0.pt
  predictions:    results/predictions/cnn_receptor_only_RN_hard_seed0.csv
  learning_curve: results/figures/cnn_receptor_only_RN_hard_seed0.png